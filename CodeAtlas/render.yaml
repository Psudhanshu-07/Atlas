services:
  - type: web
    name: codeatlas-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CODEATLAS_DATA_DIR
        value: /var/data/.codeatlas
      - key: CODEATLAS_BASE_URL
        sync: false
      - key: CODEATLAS_FRONTEND_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: CODEATLAS_ADMIN_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
    disk:
      name: codeatlas-data
      mountPath: /var/data
      sizeGB: 1
