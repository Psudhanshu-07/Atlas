# Render Blueprint — deploys the CodeAtlas API (which also serves the web
# client at /) as one web service.
#
# 1. Render Dashboard → New → Blueprint → pick this repository.
# 2. Render asks for the `sync: false` values (the secrets) — see the list in
#    README.md / .env.example. DATABASE_URL points at Supabase.
# 3. The schema is created automatically on the first boot; no migration step.
#
# The optional persistent disk keeps repository checkouts and uploaded avatars
# across redeploys. On the free plan, delete the `disk` block and the
# CODEATLAS_DATA_DIR variable; data re-syncs from the database instead.

services:
  - type: web
    name: codeatlas-api
    runtime: node
    plan: starter
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Supabase connection string (Project Settings → Database)
      - key: CODEATLAS_STORAGE_KEY
        generateValue: true # keeps GitHub tokens decryptable across redeploys
      - key: GITHUB_CLIENT_ID
        sync: false # OAuth app credentials
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Set CODEATLAS_BASE_URL to the Render URL (https://…onrender.com) so
      # OAuth callbacks use the deployed callback URL instead of a request
      # header. Leave empty to derive it per request.
      - key: CODEATLAS_BASE_URL
        sync: false
      # Split-frontend mode only (SPA hosted on Vercel): the frontend's origin,
      # e.g. https://atlas-frontend.vercel.app. Leave empty when the SPA is
      # served by this service (the default here — no CORS, same-origin cookies).
      - key: CODEATLAS_FRONTEND_URL
        sync: false
      - key: CODEATLAS_DATA_DIR
        sync: false # /var/data/.codeatlas when the disk below is enabled
    disk:
      name: codeatlas-data
      mountPath: /var/data
      sizeGB: 5
